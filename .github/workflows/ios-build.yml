name: iOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Cache Kotlin/Native compiler
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts', '**/gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build shared framework for iOS Simulator
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Resolve Swift Package Dependencies
        working-directory: iosApp
        run: xcodebuild -resolvePackageDependencies -project iosApp.xcodeproj -scheme iosApp

      - name: Build iOS App (Simulator)
        working-directory: iosApp
        run: |
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create Appetize zip
        working-directory: iosApp
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent PeacefulFlight.app PeacefulFlight-appetize.zip

      - name: Upload simulator app folder
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios-simulator-build
          path: iosApp/build/Build/Products/Debug-iphonesimulator/
          retention-days: 7

      - name: Upload Appetize zip
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios-appetize-build
          path: iosApp/build/Build/Products/Debug-iphonesimulator/PeacefulFlight-appetize.zip
          retention-days: 7
